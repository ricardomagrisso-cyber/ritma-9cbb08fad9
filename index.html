<style>
 :root{--fundo:#faf9f7;--tinta:#1c1a17;--fraco:#6b6560;--linha:#e2ded8;--campo:#fff;--erro:#b3261e}
 @media (prefers-color-scheme:dark){:root{--fundo:#16150f;--tinta:#f2efe9;--fraco:#a09a92;--linha:#2f2c26;--campo:#201e18;--erro:#f2b8b5}}
 *{box-sizing:border-box}
 body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
      background:var(--fundo);color:var(--tinta);
      font-family:"Archivo",system-ui,-apple-system,sans-serif}
 form{width:100%;max-width:340px}
 h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em}
 p{margin:6px 0 22px;font-size:14px;line-height:1.5;color:var(--fraco)}
 label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;
       text-transform:uppercase;color:var(--fraco);margin-bottom:7px}
 input{width:100%;padding:13px 14px;font:inherit;font-size:16px;
       background:var(--campo);color:var(--tinta);
       border:1.5px solid var(--linha);border-radius:10px}
 input:focus{outline:none;border-color:var(--tinta)}
 button{width:100%;margin-top:12px;padding:13px;font:inherit;font-size:15px;font-weight:700;
        background:var(--tinta);color:var(--fundo);border:0;border-radius:10px;cursor:pointer}
 button[disabled]{opacity:.55;cursor:default}
 .erro{margin:12px 0 0;font-size:13px;color:var(--erro);min-height:18px}
</style>

</form>

<script>
(function(){
 var f=document.getElementById("f"),s=document.getElementById("s"),
     b=document.getElementById("b"),e=document.getElementById("e"),
     c=JSON.parse(document.getElementById("cofre").textContent);
 function bytes(t){var r=atob(t),a=new Uint8Array(r.length);
   for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
 f.onsubmit=async function(ev){
  ev.preventDefault(); e.textContent=""; b.disabled=true; b.textContent="Abrindo…";
  try{
   var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(s.value),
             "PBKDF2",false,["deriveKey"]);
   var k=await crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:bytes(c.sal),iterations:c.iter,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["decrypt"]);
   var claro=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(c.iv)},k,bytes(c.cifra));
   var html=new TextDecoder().decode(claro);
   document.open(); document.write(html); document.close();
  }catch(_){
   // GCM so falha assim quando a senha esta errada: a etiqueta nao confere.
   e.textContent="Senha incorreta."; b.disabled=false; b.textContent="Abrir";
   s.select();
  }
 };
 s.focus();
})();
</script>
